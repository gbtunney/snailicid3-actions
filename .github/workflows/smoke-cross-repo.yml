name: Smoke Cross-Repo (main)

# SOURCE: gbtunney/snailicid3-actions
# Cross-repository startup smoke for the current main contract.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - '.github/workflows/**'
            - 'templates/workflows/**'

concurrency:
    group: smoke-cross-repo-main
    cancel-in-progress: true

env:
    HUSKY: 0

jobs:
    release_plan:
        name: call-release-plan.yml@main
        permissions:
            contents: write
            actions: write
            id-token: write
            pull-requests: write
        uses: gbtunney/snailicid3-actions/.github/workflows/call-release-plan.yml@main
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
            dry_run: true
            run_pipeline: false

    pipeline:
        name: call-pipeline.yml@main
        permissions:
            contents: read
        uses: gbtunney/snailicid3-actions/.github/workflows/call-pipeline.yml@main
        with:
            mode: report
            check_mode: skip
            api_report_mode: skip
            lockfile_mode: frozen
            build_mode: skip
            test_mode: skip
            docs_mode: skip
            require_clean_repo: false

    nx_targets:
        name: call-nx-targets.yml@main
        permissions:
            contents: read
        uses: gbtunney/snailicid3-actions/.github/workflows/call-nx-targets.yml@main
        with:
            scope: all
            targets: lint
            mode: report

    verify:
        name: verify remote callers
        needs: [release_plan, pipeline, nx_targets]
        if: ${{ always() }}
        runs-on: ubuntu-latest

        steps:
            - name: Assert every remote-ref caller completed
              shell: bash
              run: |
                  set -euo pipefail

                  release_plan="${{ needs.release_plan.result }}"
                  pipeline="${{ needs.pipeline.result }}"
                  nx_targets="${{ needs.nx_targets.result }}"

                  {
                    echo "## 🛰️ Cross-repository caller smoke (@main)"
                    echo ""
                    echo "- call-release-plan.yml@main: \`$release_plan\`"
                    echo "- call-pipeline.yml@main: \`$pipeline\`"
                    echo "- call-nx-targets.yml@main: \`$nx_targets\`"
                    echo "- release phase: \`${{ needs.release_plan.outputs.release_phase }}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

                  if [[ "$release_plan" != "success" || "$pipeline" != "success" || "$nx_targets" != "success" ]]; then
                    echo "::error::A remote-ref caller did not succeed."
                    exit 1
                  fi
