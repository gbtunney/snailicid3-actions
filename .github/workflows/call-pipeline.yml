# ─────────────────────────────────────────────────────────────
# WORKFLOW: Pipeline
# TYPE: reusable (workflow_call)
# SOURCE: gbtunney/snailicid3-actions
#
# Normal PR/release validation uses predictable repository routines. Arbitrary
# Nx target execution lives in call-nx-targets.yml instead of competing with
# this pipeline's build/test/check/docs behavior.
#
# Chromatic is intentionally outside this workflow. Consumers own their token
# names and Chromatic workflow and may use the shared run-chromatic composite.
# ─────────────────────────────────────────────────────────────

name: z Pipeline 🚰

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: Optional ref to check out before running the pipeline.
                required: false
                default: ''
                type: string

            mode:
                description: Failure policy for reporting/check/API routines.
                required: false
                default: report
                type: string

            check_mode:
                description: Check operation to run.
                required: false
                default: check
                type: string

            api_report_mode:
                description: API report operation to run.
                required: false
                default: skip
                type: string

            lockfile_mode:
                description: >
                    How the install treats pnpm-lock.yaml. frozen never rewrites it;
                    reconcile updates the existing lockfile as needed to satisfy manifests.
                required: false
                default: frozen
                type: string

            build_mode:
                description: Build behavior — skip, report, or abort_on_error.
                required: false
                default: ''
                type: string

            test_mode:
                description: Test behavior — skip, report, or abort_on_error.
                required: false
                default: ''
                type: string

            docs_mode:
                description: Docs-build behavior — skip, report, or abort_on_error.
                required: false
                default: ''
                type: string

            require_clean_repo:
                description: Fail if repository routines leave tracked changes.
                required: false
                default: false
                type: boolean

            upload_workspace_artifact:
                description: Upload a workspace snapshot for an explicit downstream operation.
                required: false
                default: false
                type: boolean

            artifact_name_prefix:
                description: Prefix for an explicitly requested workspace artifact.
                required: false
                default: workspace
                type: string

            node_version:
                description: Node version for compatibility-sensitive callers such as the smoke matrix.
                required: false
                default: '24'
                type: string

            # Transitional compatibility for already-published callers. New
            # templates use build_mode/test_mode/docs_mode. These aliases let
            # call-release-plan.yml and older @main callers migrate without a
            # startup-breaking flag day.
            run_build:
                description: Deprecated compatibility alias for build_mode.
                required: false
                default: true
                type: boolean

            run_test:
                description: Deprecated compatibility alias for test_mode.
                required: false
                default: false
                type: boolean

            run_docs_build:
                description: Deprecated compatibility alias for docs_mode.
                required: false
                default: false
                type: boolean

            pnpm_cache:
                description: Deprecated compatibility input; retained until nested callers are migrated.
                required: false
                default: true
                type: boolean

            disable_nx_cloud:
                description: Deprecated compatibility input; repository policy moves to #13.
                required: false
                default: vars
                type: string

        outputs:
            is_repo_dirty:
                description: Whether repository is dirty at end ('true'|'false')
                value: ${{ jobs.pipeline.outputs.is_repo_dirty }}

            workspace_artifact_name:
                description: Artifact name if uploaded; empty string otherwise
                value: ${{ jobs.pipeline.outputs.workspace_artifact_name }}

            artifact_uploaded:
                description: Whether artifact upload ran successfully ('true'|'false')
                value: ${{ jobs.pipeline.outputs.artifact_uploaded }}

permissions:
    contents: read

env:
    HUSKY: 0
    NX_NO_CLOUD: 'true'

jobs:
    pipeline:
        runs-on: ubuntu-latest
        name: pipeline

        outputs:
            is_repo_dirty: ${{ steps.repo_dirty.outputs.is_repo_dirty }}
            workspace_artifact_name: ${{ steps.artifact_name.outputs.name }}
            artifact_uploaded: ${{ steps.artifact_uploaded.outputs.artifact_uploaded }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.checkout_ref || github.ref }}

            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
                  cache: false

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ inputs.node_version }}
                  cache: ${{ inputs.pnpm_cache && 'pnpm' || '' }}
                  cache-dependency-path: pnpm-lock.yaml

            - name: Validate pipeline policy
              shell: bash
              run: |
                  set -euo pipefail

                  case "${{ inputs.mode }}" in
                    report|abort_on_error) ;;
                    *) echo "::error::Invalid mode: ${{ inputs.mode }}. Expected report or abort_on_error."; exit 1 ;;
                  esac

                  case "${{ inputs.check_mode }}" in
                    fix|check|skip) ;;
                    *) echo "::error::Invalid check_mode: ${{ inputs.check_mode }}. Expected fix, check, or skip."; exit 1 ;;
                  esac

                  case "${{ inputs.api_report_mode }}" in
                    update|check|skip) ;;
                    *) echo "::error::Invalid api_report_mode: ${{ inputs.api_report_mode }}. Expected update, check, or skip."; exit 1 ;;
                  esac

                  case "${{ inputs.lockfile_mode }}" in
                    frozen|reconcile) ;;
                    *) echo "::error::Invalid lockfile_mode: ${{ inputs.lockfile_mode }}. Expected frozen or reconcile."; exit 1 ;;
                  esac

                  case "${{ inputs.disable_nx_cloud }}" in
                    vars|true|false) ;;
                    *) echo "::error::Invalid disable_nx_cloud: ${{ inputs.disable_nx_cloud }}. Expected vars, true, or false."; exit 1 ;;
                  esac

            - name: Resolve routine modes
              id: routines
              shell: bash
              run: |
                  set -euo pipefail

                  build_mode="${{ inputs.build_mode }}"
                  test_mode="${{ inputs.test_mode }}"
                  docs_mode="${{ inputs.docs_mode }}"

                  if [[ -z "$build_mode" ]]; then
                    build_mode="${{ inputs.run_build && inputs.mode || 'skip' }}"
                  fi
                  if [[ -z "$test_mode" ]]; then
                    test_mode="${{ inputs.run_test && inputs.mode || 'skip' }}"
                  fi
                  if [[ -z "$docs_mode" ]]; then
                    docs_mode="${{ inputs.run_docs_build && inputs.mode || 'skip' }}"
                  fi

                  for routine_mode in "$build_mode" "$test_mode" "$docs_mode"; do
                    case "$routine_mode" in
                      skip|report|abort_on_error) ;;
                      *) echo "::error::Invalid routine mode: $routine_mode. Expected skip, report, or abort_on_error."; exit 1 ;;
                    esac
                  done

                  echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"
                  echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"
                  echo "docs_mode=$docs_mode" >> "$GITHUB_OUTPUT"

            - name: Resolve Nx Cloud policy
              id: nx_cloud_policy
              shell: bash
              run: |
                  set -euo pipefail
                  input_value="${{ inputs.disable_nx_cloud }}"
                  if [[ "$input_value" == "vars" ]]; then
                    input_value="${{ vars.DISABLE_NX_CLOUD || 'true' }}"
                  fi
                  value="$(printf '%s' "$input_value" | tr '[:upper:]' '[:lower:]')"
                  if [[ "$value" != "true" && "$value" != "false" ]]; then
                    echo "::warning::Invalid Nx Cloud policy '$value'; defaulting to true."
                    value="true"
                  fi
                  echo "disabled=$value" >> "$GITHUB_OUTPUT"

            - name: Enable Nx Cloud
              if: ${{ steps.nx_cloud_policy.outputs.disabled == 'false' }}
              run: echo "NX_NO_CLOUD=false" >> "$GITHUB_ENV"

            - name: Pipeline summary
              shell: bash
              run: |
                  {
                    echo "## Pipeline policy"
                    echo ""
                    echo "- checkout_ref: \`${{ inputs.checkout_ref || github.ref }}\`"
                    echo "- mode: \`${{ inputs.mode }}\`"
                    echo "- check_mode: \`${{ inputs.check_mode }}\`"
                    echo "- api_report_mode: \`${{ inputs.api_report_mode }}\`"
                    echo "- lockfile_mode: \`${{ inputs.lockfile_mode }}\`"
                    echo "- build_mode: \`${{ steps.routines.outputs.build_mode }}\`"
                    echo "- test_mode: \`${{ steps.routines.outputs.test_mode }}\`"
                    echo "- docs_mode: \`${{ steps.routines.outputs.docs_mode }}\`"
                    echo "- require_clean_repo: \`${{ inputs.require_clean_repo }}\`"
                    echo "- upload_workspace_artifact: \`${{ inputs.upload_workspace_artifact }}\`"
                    echo "- Nx Cloud disabled: \`${{ steps.nx_cloud_policy.outputs.disabled }}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Record lockfile fingerprint
              id: lockfile_before
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -f pnpm-lock.yaml ]]; then
                    echo "sha=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
                  else
                    echo "sha=absent" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install frozen lockfile
              if: ${{ inputs.lockfile_mode == 'frozen' }}
              shell: bash
              run: |
                  set -euo pipefail
                  if pnpm install --frozen-lockfile; then
                    exit 0
                  fi
                  echo "::error::pnpm install --frozen-lockfile failed — see pnpm's error above. If it is an outdated-lockfile error, use the explicit reconcile route. Validation never rewrites pnpm-lock.yaml on its own."
                  exit 1

            - name: Install and reconcile lockfile
              if: ${{ inputs.lockfile_mode == 'reconcile' }}
              run: pnpm install --no-frozen-lockfile

            - name: Report lockfile change
              id: lockfile_after
              if: ${{ always() }}
              shell: bash
              run: |
                  set -euo pipefail
                  before="${{ steps.lockfile_before.outputs.sha }}"
                  after="absent"
                  if [[ -f pnpm-lock.yaml ]]; then
                    after="$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)"
                  fi
                  if [[ "$before" == "$after" ]]; then
                    echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Report environment
              if: ${{ always() }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              uses: $/.github/actions/report-environment

            - name: Report repository
              if: ${{ always() }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              uses: $/.github/actions/report-repository

            - name: Report Prettier
              if: ${{ always() }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              uses: $/.github/actions/report-prettier

            - name: Report workspace
              if: ${{ always() }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              uses: $/.github/actions/report-workspace

            - name: Nx report
              if: ${{ always() }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: pnpm exec nx report

            - name: Run build
              if: ${{ steps.routines.outputs.build_mode != 'skip' }}
              continue-on-error: ${{ steps.routines.outputs.build_mode == 'report' }}
              run: pnpm build

            - name: Run test
              if: ${{ steps.routines.outputs.test_mode != 'skip' }}
              continue-on-error: ${{ steps.routines.outputs.test_mode == 'report' }}
              run: pnpm test

            - name: Run docs build
              if: ${{ steps.routines.outputs.docs_mode != 'skip' }}
              continue-on-error: ${{ steps.routines.outputs.docs_mode == 'report' }}
              run: pnpm run docs:build

            - name: Run fix routine
              if: ${{ inputs.check_mode == 'fix' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: pnpm fix

            - name: Run check routine
              if: ${{ inputs.check_mode == 'check' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: pnpm check

            - name: Run update API report
              if: ${{ inputs.api_report_mode == 'update' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: pnpm api:report

            - name: Run check API report
              if: ${{ inputs.api_report_mode == 'check' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: pnpm api:check

            - name: Check repository dirty state
              id: repo_dirty
              if: ${{ always() }}
              shell: bash
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "is_repo_dirty=true" >> "$GITHUB_OUTPUT"
                    git status --short
                  else
                    echo "is_repo_dirty=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Require clean repository
              if: ${{ inputs.require_clean_repo && steps.repo_dirty.outputs.is_repo_dirty == 'true' }}
              run: |
                  echo "Repository is dirty after pipeline."
                  exit 1

            - name: Compute artifact name
              id: artifact_name
              if: ${{ always() && inputs.upload_workspace_artifact }}
              shell: bash
              run: |
                  name="${{ inputs.artifact_name_prefix }}-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}"
                  name="${name//\//-}"
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - name: Create workspace snapshot
              id: workspace_snapshot
              if: ${{ always() && inputs.upload_workspace_artifact }}
              shell: bash
              run: |
                  archive_path="${{ runner.temp }}/workspace-artifact.tar.gz"
                  tar -czf "$archive_path" \
                    --exclude='.git' \
                    --exclude='.env*' \
                    --exclude='**/.env*' \
                    --exclude='**/node_modules' \
                    --exclude='**/.nx/cache' \
                    --exclude='**/.pnpm-store' \
                    --exclude='**/coverage' \
                    --exclude='**/.turbo' \
                    .
                  echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

            - name: Upload workspace snapshot
              id: upload_workspace
              if: ${{ always() && inputs.upload_workspace_artifact }}
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.artifact_name.outputs.name }}
                  if-no-files-found: error
                  path: ${{ steps.workspace_snapshot.outputs.archive_path }}

            - name: Mark artifact uploaded
              id: artifact_uploaded
              if: ${{ always() }}
              shell: bash
              run: |
                  if [[ "${{ inputs.upload_workspace_artifact }}" == "true" && "${{ steps.upload_workspace.outcome }}" == "success" ]]; then
                    echo "artifact_uploaded=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "artifact_uploaded=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Output summary
              if: ${{ always() }}
              shell: bash
              run: |
                  {
                    echo ""
                    echo "## Outputs"
                    echo ""
                    echo "- is_repo_dirty: \`${{ steps.repo_dirty.outputs.is_repo_dirty }}\`"
                    echo "- lockfile_mode: \`${{ inputs.lockfile_mode }}\`"
                    echo "- lockfile_changed: \`${{ steps.lockfile_after.outputs.lockfile_changed }}\`"
                    echo "- artifact_uploaded: \`${{ steps.artifact_uploaded.outputs.artifact_uploaded }}\`"
                    echo "- workspace_artifact_name: \`${{ steps.artifact_name.outputs.name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
