name: z Call Release Plan

# SOURCE: gbtunney/snailicid3-actions

# ─────────────────────────────────────────────────────────────
# WORKFLOW: Release Plan
# TYPE: reusable (workflow_call)
#
# Purpose:
#   Run the release decision tree for one ref/SHA.
#
# This is intentionally separate from call-detect-release-state.yml:
#
#   call-detect-release-state.yml
#     Pure inventory/state detection. No build. No mutation. No publish.
#
#   call-release-plan.yml
#     Interprets that detected state as a release workflow plan.
#     It can be used manually now and by push-main later.
#
# Current behavior:
#   - Always produces the canonical release plan and prints it.
#   - mode: observe reports the selected phase and changes nothing.
#   - mode: release executes the selected phase — a Changesets version PR when
#     intent is pending, or a validated publish when it is not.
#
# Caller contract:
#   release_mode: manual | main   the repository's policy. manual releases only
#                                 by dispatch; main also lets a push to the
#                                 default branch release.
#   mode:         observe | release   what this run does. Empty lets
#                                 release_mode decide.
#
# Safety:
#   - observe is the default for everything except a push under
#     release_mode: main.
#   - A release away from the default branch is blocked unless
#     allow_non_main=true.
#   - A push cannot release unless the repository opted in with
#     release_mode: main. Manual dispatch is always available.
#   - A release's prerequisites (validation pipeline, workspace artifact) are
#     derived, so a real release cannot silently no-op because an input was
#     left at a non-releasing value.
#   - Registry absence is inventory, never authorization.
#
# Secrets contract:
#   Both secrets below are optional and only consumed on the release path.
#   Callers forward them by name — see templates/README.md. Nothing in this
#   workflow relies on `secrets: inherit`.
# ─────────────────────────────────────────────────────────────

on:
    workflow_call:
        secrets:
            GH_PAT:
                description: Optional token used for checkout/push so follow-up workflows can be triggered.
                required: false
            NPM_TOKEN:
                description: Optional npm automation token for real publish runs.
                required: false

        inputs:
            ref:
                description: Branch, tag, or SHA to inspect. Leave empty to inspect the triggering commit.
                required: false
                default: ''
                type: string

            release_mode:
                description: >
                    This repository's release policy. 'manual' means nothing releases automatically —
                    releases happen by explicit dispatch. 'main' opts the repository into running the
                    release policy automatically on pushes to its default branch. Manual dispatch works
                    under either setting.
                required: false
                default: manual
                type: string

            mode:
                description: >
                    What this run should do. 'observe' reports the release plan and changes nothing;
                    'release' executes the selected phase. Leave empty to let release_mode decide:
                    a push under release_mode 'main' releases, and anything else observes.
                required: false
                default: ''
                type: string

            allow_non_main:
                description: Advanced. Allow a release away from the default branch. Keep false except for
                    controlled tests.
                required: false
                default: false
                type: boolean

            lockfile_mode:
                description: >
                    Advanced. How the install treats pnpm-lock.yaml. frozen fails when the lockfile no longer
                    satisfies the manifests; reconcile updates the existing lockfile as needed to
                    satisfy them. reconcile is not a reset: it does not delete the lockfile and
                    resolve from scratch.
                required: false
                default: frozen
                type: string

            node_version:
                description: Advanced. Node version to run the validation pipeline with. Prefer a concrete major
                    (e.g. '24') over an alias like 'lts/*' so setup-node resolves from the runner toolcache instead
                    of fetching GitHub's version manifest over the network.
                required: false
                default: '24'
                type: string

            adapter_ref:
                description: >
                    Advanced. Ref of gbtunney/snailicid3-actions to take the release-plan adapter from. Consumers
                    should pin the same tag they call this workflow at.
                required: false
                default: main
                type: string

            # ── Deprecated. Accepted for one window so callers pinned to a tag
            # published before `mode` existed keep working. Each maps onto the
            # semantic modes above rather than running a second implementation.
            dry_run:
                description: >
                    DEPRECATED — use mode instead. 'false' is read as mode 'release'; 'true' expresses no
                    opinion, because it cannot be told apart from the default. Setting it alongside
                    mode 'observe' is a conflict and fails.
                required: false
                default: true
                type: boolean

            run_pipeline:
                description: >
                    DEPRECATED — the validation pipeline is derived from mode. A release requires it, so
                    setting this false with mode 'release' fails rather than silently skipping the
                    validation a release depends on.
                required: false
                default: true
                type: boolean

            upload_workspace_artifact:
                description: >
                    DEPRECATED and ignored — the workspace artifact is derived. Publication consumes it, so a
                    release always uploads one. Setting this false with mode 'release' fails rather than
                    producing a release that silently publishes nothing.
                required: false
                default: true
                type: boolean

        outputs:
            checked_ref:
                description: Resolved commit SHA inspected by release-state detection.
                value: ${{ jobs.detect.outputs.checked_ref }}

            release_phase:
                description: pending_changeset | pending_release | main
                value: ${{ jobs.plan.outputs.release_phase }}

            execution:
                description: >
                    What this run actually did — observe | release. Resolved from mode, release_mode and the
                    triggering event, so a caller can see which of the two it got without re-deriving it.
                value: ${{ jobs.plan.outputs.execution }}

            should_version:
                description: "'true' when release intent is pending."
                value: ${{ jobs.plan.outputs.should_version }}

            should_publish:
                description: >
                    "'true' only when the release plan actually offers a publish operation, which is never for a
                    read-only observation: a package version missing from the registry is inventory, not
                    authorization. Callers that used this to mean 'there is something to release' want
                    release_inventory_count instead."
                value: ${{ jobs.plan.outputs.should_publish }}

            should_skip:
                description: "'true' when no release action is needed."
                value: ${{ jobs.plan.outputs.should_skip }}

            publish_candidates:
                description: >
                    Space-delimited package@version entries whose exact version is absent from the registry. Retained
                    under its original name for existing callers; it is inventory, and publishing it still requires an
                    explicit release run that clears the real-release guard.
                value: ${{ jobs.plan.outputs.release_inventory }}

            release_inventory_count:
                description: Number of package versions absent from the registry.
                value: ${{ jobs.plan.outputs.release_inventory_count }}

            workspace_artifact_name:
                description: Workspace snapshot artifact name, when the pipeline ran and uploaded one.
                value: ${{ jobs.pending_release_pipeline.outputs.workspace_artifact_name }}

permissions:
    contents: write
    actions: write
    id-token: write
    pull-requests: write

jobs:
    detect:
        name: detect release state
        uses: ./.github/workflows/call-detect-release-state.yml
        with:
            ref: ${{ inputs.ref }}

    # The canonical plan is the only source of phase selection. It runs beside
    # the detector rather than after it: the detector survives solely because it
    # owns the pending-changeset filenames schemaVersion 1 does not carry, which
    # the version branch is still named from. It decides nothing.
    #
    # schemaVersion validation is the hard boundary, so an unreadable or
    # unsupported plan stops the release rather than degrading to a guess.
    # The plan a release acts on and the report a pull request sees are the
    # same document produced by the same workflow. Nothing here can publish:
    # call-release-observe.yml declares contents: read and no secrets.
    canonical_plan:
        name: canonical release plan
        needs: detect
        uses: ./.github/workflows/call-release-observe.yml
        with:
            ref: ${{ inputs.ref }}
            adapter_ref: ${{ inputs.adapter_ref }}
            node_version: ${{ inputs.node_version }}

    plan:
        name: release plan
        needs: [detect, canonical_plan]
        runs-on: ubuntu-latest

        outputs:
            execution: ${{ steps.execution.outputs.execution }}
            release_phase: ${{ steps.phase.outputs.release_phase }}
            should_version: ${{ steps.phase.outputs.should_version }}
            should_publish: ${{ steps.phase.outputs.should_publish }}
            should_skip: ${{ steps.phase.outputs.should_skip }}
            release_inventory: ${{ steps.phase.outputs.release_inventory }}
            release_inventory_count: ${{ steps.phase.outputs.release_inventory_count }}

        steps:
            - name: Validate lockfile mode
              shell: bash
              run: |
                  set -euo pipefail
                  case "${{ inputs.lockfile_mode }}" in
                    frozen|reconcile) ;;
                    *) echo "::error::Invalid lockfile_mode: ${{ inputs.lockfile_mode }}. Expected frozen or reconcile."; exit 1 ;;
                  esac

            # One place resolves what this run does. Everything downstream reads
            # the answer rather than re-deriving it from an input, so there is no
            # second opinion about whether a run is a release.
            #
            # The deprecated booleans map onto the modes here; they never reach a
            # job condition. `dry_run: true` is deliberately treated as "no
            # opinion": it is also the default, so an explicit true and an unset
            # input are indistinguishable, and reading it as "observe" would
            # override a caller that asked for mode: release.
            - name: Resolve execution mode
              id: execution
              shell: bash
              env:
                  MODE: ${{ inputs.mode }}
                  RELEASE_MODE: ${{ inputs.release_mode }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  RUN_PIPELINE: ${{ inputs.run_pipeline }}
                  UPLOAD_ARTIFACT: ${{ inputs.upload_workspace_artifact }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail

                  case "$RELEASE_MODE" in
                    manual|main) ;;
                    *) echo "::error::Invalid release_mode: '$RELEASE_MODE'. Expected manual or main."; exit 1 ;;
                  esac

                  case "$MODE" in
                    ''|observe|release) ;;
                    *) echo "::error::Invalid mode: '$MODE'. Expected observe or release."; exit 1 ;;
                  esac

                  # An explicit observe alongside an explicit dry_run: false is a
                  # caller contradicting itself about the one thing that matters.
                  if [ "$MODE" = "observe" ] && [ "$DRY_RUN" = "false" ]; then
                    echo "::error::Conflicting inputs: mode 'observe' with dry_run 'false'. dry_run is deprecated; set mode alone."
                    exit 1
                  fi

                  if [ -n "$MODE" ]; then
                    execution="$MODE"
                    reason="mode: $MODE"
                  elif [ "$DRY_RUN" = "false" ]; then
                    execution="release"
                    reason="deprecated dry_run: false"
                    echo "::warning::dry_run is deprecated. Set mode: release instead."
                  elif [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_MODE" = "main" ]; then
                    execution="release"
                    reason="release_mode: main on a push"
                  else
                    execution="observe"
                    reason="default for release_mode: $RELEASE_MODE on $EVENT_NAME"
                  fi

                  # A release's prerequisites are derived, never clicked. Refusing
                  # here is the point: a release that quietly skips validation, or
                  # publishes nothing because an artifact was never uploaded, is
                  # worse than one that does not start.
                  if [ "$execution" = "release" ]; then
                    if [ "$RUN_PIPELINE" = "false" ]; then
                      echo "::error::mode 'release' requires the validation pipeline, but run_pipeline is false. run_pipeline is deprecated and derived; remove it."
                      exit 1
                    fi
                    if [ "$UPLOAD_ARTIFACT" = "false" ]; then
                      echo "::error::mode 'release' publishes from the workspace artifact, but upload_workspace_artifact is false. It is deprecated and derived; remove it."
                      exit 1
                    fi

                    # An automatic push-triggered release needs the repository to
                    # have opted in. Dispatch is always allowed: it is the
                    # explicit escape hatch.
                    if [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_MODE" != "main" ]; then
                      echo "::error::A push cannot release under release_mode '$RELEASE_MODE'. Set release_mode: main to enable automatic releases, or dispatch the release manually."
                      exit 1
                    fi
                  fi

                  echo "execution=$execution" >> "$GITHUB_OUTPUT"
                  echo "Execution: $execution ($reason)"

            - name: Decide release phase
              id: phase
              shell: bash
              env:
                  SCHEMA_VERSION: ${{ needs.canonical_plan.outputs.schema_version }}
                  RELEASE_PHASE: ${{ needs.canonical_plan.outputs.release_phase }}
                  RELEASE_PHASE_REASON: ${{ needs.canonical_plan.outputs.release_phase_reason }}
                  SHOULD_VERSION: ${{ needs.canonical_plan.outputs.should_version }}
                  SHOULD_PUBLISH: ${{ needs.canonical_plan.outputs.should_publish }}
                  RELEASE_INVENTORY: ${{ needs.canonical_plan.outputs.release_inventory }}
                  RELEASE_INVENTORY_COUNT: ${{ needs.canonical_plan.outputs.release_inventory_count }}
              run: |
                  set -euo pipefail

                  # schemaVersion is the hard boundary. The adapter already
                  # refuses an unsupported document; re-checking here makes the
                  # workflow's own dependence on schemaVersion 1 explicit rather
                  # than implied by the adapter's exit code.
                  if [ "$SCHEMA_VERSION" != "1" ]; then
                    echo "::error::Unsupported release-plan schemaVersion '$SCHEMA_VERSION'; this workflow supports 1 only."
                    exit 1
                  fi

                  if [ -z "$RELEASE_PHASE" ]; then
                    echo "::error::The canonical release plan produced no phase."
                    exit 1
                  fi

                  # should_skip describes what this workflow does, so it follows
                  # the selected phase. It is not read from the plan: an
                  # observation holding uninventoried versions reports
                  # should_publish=false, and its own notion of "nothing to do"
                  # would claim that on a run about to take pending_release.
                  if [ "$RELEASE_PHASE" = "main" ]; then
                    should_skip=true
                  else
                    should_skip=false
                  fi

                  {
                    echo "release_phase=$RELEASE_PHASE"
                    echo "should_version=$SHOULD_VERSION"
                    echo "should_publish=$SHOULD_PUBLISH"
                    echo "should_skip=$should_skip"
                    echo "release_inventory=$RELEASE_INVENTORY"
                    echo "release_inventory_count=$RELEASE_INVENTORY_COUNT"
                  } >> "$GITHUB_OUTPUT"

                  {
                    echo "## Release phase selection"
                    echo ""
                    echo "- phase: \`$RELEASE_PHASE\`"
                    echo "- $RELEASE_PHASE_REASON"
                    echo ""
                    if [ "$RELEASE_PHASE" = "pending_release" ]; then
                      echo "\`pending_release\` reports inventory, not authorization. Publication still requires an"
                      echo "explicit non-dry-run invocation that clears the real-release guard."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Print release plan
              shell: bash
              run: |
                  set -euo pipefail

                  phase="${{ steps.phase.outputs.release_phase }}"
                  execution="${{ steps.execution.outputs.execution }}"

                  {
                    echo "## 🧭 Release plan"
                    echo ""
                    echo "- input ref: ${{ inputs.ref || 'github.sha' }}"
                    echo "- checked ref: ${{ needs.detect.outputs.checked_ref }}"
                    echo "- execution: ${{ steps.execution.outputs.execution }} (release_mode: ${{ inputs.release_mode }})"
                    echo "- allow non-main: ${{ inputs.allow_non_main }}"
                    echo "- phase: $phase"
                    echo ""
                    echo "## 📦 Selected release state"
                    echo ""
                    echo "Populated from the active phase source."
                    echo ""
                    echo "- should_version: ${{ steps.phase.outputs.should_version }}"
                    echo "- should_publish: ${{ steps.phase.outputs.should_publish }}"
                    echo "- should_skip: ${{ steps.phase.outputs.should_skip }}"
                    echo "- release_inventory_count: ${{ steps.phase.outputs.release_inventory_count }}"
                    echo "- release_inventory: ${{ steps.phase.outputs.release_inventory }}"
                    echo ""
                    echo "## 🧾 Detector-only state"
                    echo ""
                    echo "Fields the release-plan schemaVersion 1 does not carry. These stay detector-derived."
                    echo ""
                    echo "- changeset_count: ${{ needs.detect.outputs.changeset_count }}"
                    echo "- changeset_slugs: ${{ needs.detect.outputs.changeset_slugs }}"
                    echo "- primary_changeset_slug: ${{ needs.detect.outputs.primary_changeset_slug }}"
                    echo "- new_package_count: ${{ needs.detect.outputs.new_package_count }}"
                    echo "- new_version_count: ${{ needs.detect.outputs.new_version_count }}"
                    echo ""
                    echo "## ✅ Planned action"
                    echo ""

                    if [ "$phase" = "pending_changeset" ]; then
                      echo "This ref has pending release intent."
                      if [ "$execution" = "observe" ]; then
                        echo "Dry run: would create or update a Changesets version PR."
                      else
                        echo "Real mode: would create or update a Changesets version PR."
                      fi
                    elif [ "$phase" = "pending_release" ]; then
                      echo "This ref holds package versions the registry does not have, and no pending release intent."
                      echo "That is inventory, not authorization to publish it."
                      if [ "$execution" = "observe" ]; then
                        echo "Dry run: would validate and prepare release candidate artifacts."
                        echo "Dry run: inventory is ${{ steps.phase.outputs.release_inventory }}."
                      else
                        echo "Real mode: would validate and publish: ${{ steps.phase.outputs.release_inventory }}."
                      fi
                    else
                      echo "No release action is needed."
                    fi
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    guard_real_release:
        name: guard real release
        needs: [detect, plan]
        if: ${{ needs.plan.outputs.execution == 'release' }}

        runs-on: ubuntu-latest

        steps:
            - name: Block unsafe non-main real release
              shell: bash
              run: |
                  set -euo pipefail

                  requested_ref="${{ inputs.ref }}"
                  allow_non_main="${{ inputs.allow_non_main }}"

                  if [ "$allow_non_main" = "true" ]; then
                    echo "allow_non_main=true; a release away from main is allowed for this run."
                    exit 0
                  fi

                  if [ -z "$requested_ref" ] || [ "$requested_ref" = "main" ] || [ "$requested_ref" = "refs/heads/main" ]; then
                    echo "Release allowed for the main/default triggering ref."
                    exit 0
                  fi

                  echo "::error::mode 'release' is only allowed for main unless allow_non_main=true."
                  echo "requested_ref=$requested_ref"
                  exit 1

    pending_changeset:
        name: pending changeset version PR
        needs: [detect, plan, guard_real_release]
        if: ${{ always() && needs.plan.outputs.release_phase == 'pending_changeset' && (needs.plan.outputs.execution == 'observe' || needs.guard_real_release.result == 'success') }}
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
            NX_NO_CLOUD: ${{ (vars.DISABLE_NX_CLOUD || 'true') == 'true' && 'true' || 'false' }}

        steps:
            - name: Checkout release source
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref || github.sha }}
                  token: ${{ secrets.GH_PAT || github.token }}

            - name: Derive release branch from pending changesets
              id: release_branch
              shell: bash
              run: |
                  set -euo pipefail

                  changeset_count="${{ needs.detect.outputs.changeset_count }}"
                  primary_changeset_slug="${{ needs.detect.outputs.primary_changeset_slug }}"

                  if [[ "$changeset_count" -eq 0 || -z "$primary_changeset_slug" ]]; then
                    echo "::error::No pending changeset files were found to derive the release branch slug."
                    exit 1
                  fi

                  if [[ "$changeset_count" -eq 1 ]]; then
                    release_slug="$primary_changeset_slug"
                  else
                    first_slug="$primary_changeset_slug"
                    remaining_count="$((changeset_count - 1))"
                    release_slug="${first_slug}-plus-${remaining_count}-more"
                  fi

                  release_slug="$(printf '%s' "$release_slug" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"

                  if [[ -z "$release_slug" ]]; then
                    short_sha="${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
                    release_slug="changeset-${short_sha:0:8}"
                  fi

                  max_slug_length=120
                  if [[ "${#release_slug}" -gt "$max_slug_length" ]]; then
                    release_slug="${release_slug:0:max_slug_length}"
                    release_slug="${release_slug%-}"
                  fi

                  release_branch="release/${release_slug}"

                  echo "slug=$release_slug" >> "$GITHUB_OUTPUT"
                  echo "branch=$release_branch" >> "$GITHUB_OUTPUT"
                  echo "count=$changeset_count" >> "$GITHUB_OUTPUT"
                  echo "Resolved release branch: $release_branch"

            - name: Plan version PR action
              if: ${{ needs.plan.outputs.execution == 'observe' }}
              shell: bash
              run: |
                  set -euo pipefail
                  echo "Dry run: would create/update a Changesets version PR."
                  echo "Dry run: pending changeset count = ${{ needs.detect.outputs.changeset_count }}"
                  echo "Dry run: target branch would be ${{ steps.release_branch.outputs.branch }}."
                  echo "Dry run: commit and PR title would be derived via scope-commit (release(<scopes>): version packages)."

            - name: Setup pnpm
              if: ${{ needs.plan.outputs.execution == 'release' }}
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              if: ${{ needs.plan.outputs.execution == 'release' }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ inputs.node_version }}
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              if: ${{ needs.plan.outputs.execution == 'release' }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "${{ inputs.lockfile_mode }}" == "reconcile" ]]; then
                    pnpm install --no-frozen-lockfile
                  else
                    pnpm install --frozen-lockfile
                  fi

            - name: Version packages
              if: ${{ needs.plan.outputs.execution == 'release' }}
              run: pnpm changeset version

            - name: Stage and compute release title
              id: version_msg
              if: ${{ needs.plan.outputs.execution == 'release' }}
              shell: bash
              run: |
                  set -euo pipefail
                  git add -A

                  if git diff --cached --quiet; then
                    echo "::error::Changesets version produced no staged changes."
                    exit 1
                  fi

                  if msg="$(pnpm exec scope-commit --staged --message release "version packages")" \
                    && [[ -n "$msg" ]]; then
                    :
                  else
                    msg="release(root): version packages"
                    echo "::warning::scope-commit failed to derive a scoped release message; falling back to: $msg"
                  fi

                  echo "message=$msg" >> "$GITHUB_OUTPUT"
                  echo "Release message: $msg"

            - name: Commit version changes
              if: ${{ needs.plan.outputs.execution == 'release' }}
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config commit.gpgsign false

                  git commit -m "${{ steps.version_msg.outputs.message }}" \
                    -m "Triggered by: @${{ github.actor }}" \
                    -m "Source ref: ${{ inputs.ref || github.sha }}" \
                    -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Push release branch
              if: ${{ needs.plan.outputs.execution == 'release' }}
              run: git push origin HEAD:refs/heads/${{ steps.release_branch.outputs.branch }} --force

            - name: Create or update version PR
              if: ${{ needs.plan.outputs.execution == 'release' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
              run: |
                  set -euo pipefail
                  GH_TOKEN="${GH_TOKEN//[$' \t\r\n']/}"
                  export GH_TOKEN

                  title="${{ steps.version_msg.outputs.message }}"
                  if [[ -z "$title" ]]; then
                    title="release(root): version packages"
                    echo "::warning::No computed release message available for the PR title; falling back to: $title"
                  fi
                  body="Automated version bump from Changesets. Merge this PR to publish packages to npm."
                  release_branch="${{ steps.release_branch.outputs.branch }}"

                  pr="$(gh pr list --head "$release_branch" --base main --state open --json number -q '.[0].number' 2>/dev/null || true)"
                  if [[ -z "$pr" ]]; then
                    gh pr create --head "$release_branch" --base main --title "$title" --body "$body"
                  else
                    gh pr edit "$pr" --title "$title" --body "$body"
                  fi

            - name: Version PR summary
              if: ${{ always() }}
              shell: bash
              run: |
                  {
                    echo "## 🧾 Pending changeset version PR"
                    echo ""
                    echo "- execution: ${{ needs.plan.outputs.execution }}"
                    echo "- source_ref: ${{ inputs.ref || github.sha }}"
                    echo "- changeset_count: ${{ needs.detect.outputs.changeset_count }}"
                    echo "- target_branch: ${{ steps.release_branch.outputs.branch }}"
                    echo "- title: ${{ steps.version_msg.outputs.message || 'derived via scope-commit (observe: not computed)' }}"
                  } >> "$GITHUB_STEP_SUMMARY"

    pending_release_pipeline:
        name: pending release candidate pipeline
        needs: [detect, plan, guard_real_release]
        if: ${{ always() && (needs.plan.outputs.execution == 'release' || inputs.run_pipeline == true) && needs.plan.outputs.release_phase == 'pending_release' && (needs.plan.outputs.execution == 'observe' || needs.guard_real_release.result == 'success') }}
        uses: ./.github/workflows/call-pipeline.yml
        with:
            mode: abort_on_error
            check_mode: check
            lockfile_mode: ${{ inputs.lockfile_mode }}
            build_mode: abort_on_error
            test_mode: abort_on_error
            docs_mode: abort_on_error
            api_report_mode: check
            require_clean_repo: true
            node_version: ${{ inputs.node_version }}
            # Derived, not clicked: publication reads this artifact, so a
            # release always produces one.
            upload_workspace_artifact: true
            artifact_name_prefix: release-candidate

    pending_release_publish_plan:
        name: pending release publish plan
        needs: [detect, plan, guard_real_release, pending_release_pipeline]
        if: ${{ always() && needs.plan.outputs.execution == 'observe' && needs.plan.outputs.release_phase == 'pending_release' }}
        runs-on: ubuntu-latest

        steps:
            - name: Plan publish action
              shell: bash
              run: |
                  set -euo pipefail
                  {
                    echo "## 🚀 Publish plan"
                    echo ""
                    echo "- execution: ${{ steps.execution.outputs.execution }} (release_mode: ${{ inputs.release_mode }})"
                    echo "- release inventory: ${{ needs.plan.outputs.release_inventory }}"
                    echo "- pipeline result: ${{ needs.pending_release_pipeline.result }}"
                    echo "- workspace artifact: ${{ needs.pending_release_pipeline.outputs.workspace_artifact_name }}"
                    echo ""
                    if [ "${{ needs.plan.outputs.execution }}" = "observe" ]; then
                      echo "Dry run: would publish the listed candidates after validation."
                    fi
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    pending_release_publish:
        name: pending release publish
        needs: [detect, plan, guard_real_release, pending_release_pipeline]
        if: ${{ always() && needs.plan.outputs.execution == 'release' && needs.guard_real_release.result == 'success' && needs.plan.outputs.release_phase == 'pending_release' && needs.pending_release_pipeline.result == 'success' && needs.pending_release_pipeline.outputs.artifact_uploaded == 'true' }}
        uses: ./.github/workflows/call-apply-workspace-artifact.yml
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
            ref: ${{ inputs.ref || github.sha }}
            artifact_name: ${{ needs.pending_release_pipeline.outputs.workspace_artifact_name }}
            commit_mode: skip
            install_dependencies: true
            lockfile_mode: ${{ inputs.lockfile_mode }}
            node_version: ${{ inputs.node_version }}
            post_overlay_command: |
                set -euo pipefail

                npm whoami
                pnpm changeset publish

                publish_candidates="${{ needs.plan.outputs.release_inventory }}"

                if [[ -z "$publish_candidates" ]]; then
                  echo "No publish candidates detected after publish; skipping GitHub Release creation."
                  exit 0
                fi

                for tag_name in $publish_candidates; do
                  if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
                    echo "Tag already exists on origin: $tag_name"
                  elif git rev-parse --verify "refs/tags/${tag_name}" >/dev/null 2>&1; then
                    git push origin "refs/tags/${tag_name}:refs/tags/${tag_name}"
                  else
                    echo "::warning::Local tag not found for ${tag_name}; Changesets may have pushed it already."
                  fi

                  if gh release view "${tag_name}" >/dev/null 2>&1; then
                    echo "GitHub Release already exists for $tag_name."
                    continue
                  fi

                  echo "Creating GitHub Release for $tag_name."
                  gh release create "${tag_name}" --title "${tag_name}" --generate-notes
                done

                {
                  echo "## 🚀 Publish complete"
                  echo ""
                  echo "- published candidates: $publish_candidates"
                  echo "- tags pushed: true"
                  echo "- github releases ensured: true"
                } >> "$GITHUB_STEP_SUMMARY"

    main:
        name: no release action
        needs: [detect, plan]
        # always() is load-bearing, not decorative. A skipped or failed job
        # anywhere up the needs chain otherwise propagates down and skips this
        # one regardless of its own condition, which is how an earlier revision
        # silently stopped running the no-action path. Every other phase-gated
        # job in this workflow carries the same guard, and the outcome job fails
        # if the selected phase and the path that ran ever disagree.
        if: ${{ always() && needs.plan.outputs.release_phase == 'main' }}
        runs-on: ubuntu-latest

        steps:
            - name: Noop
              run: echo "No release action needed."

    outcome:
        name: outcome summary
        needs: [detect, plan, pending_changeset, pending_release_publish, main]
        if: ${{ always() }}
        runs-on: ubuntu-latest

        steps:
            - name: Summarize release outcome
              shell: bash
              run: |
                  set -euo pipefail

                  phase="${{ needs.plan.outputs.release_phase }}"
                  changeset_result="${{ needs.pending_changeset.result }}"
                  publish_result="${{ needs.pending_release_publish.result }}"
                  main_result="${{ needs.main.result }}"
                  inconsistent=false

                  {
                    echo "## 🎯 Release outcome"
                    echo ""
                    echo "- phase: $phase"
                    echo "- should_version: ${{ needs.plan.outputs.should_version }}"
                    echo "- should_publish: ${{ needs.plan.outputs.should_publish }}"
                    echo "- release_inventory_count: ${{ needs.plan.outputs.release_inventory_count }}"
                    echo ""

                    if [ "$phase" = "pending_changeset" ]; then
                      if [ "$changeset_result" = "success" ]; then
                        echo "✅ **Changeset PR flow ran successfully**"
                      else
                        echo "❌ **Changeset PR flow did not complete successfully** (result: $changeset_result)"
                      fi
                    elif [ "$phase" = "pending_release" ]; then
                      if [ "$publish_result" = "success" ]; then
                        echo "✅ **Publish flow ran successfully**"
                      else
                        echo "❌ **Publish flow did not complete successfully** (result: $publish_result)"
                      fi
                    else
                      if [ "$main_result" = "success" ]; then
                        echo "ℹ️ **No release action was required**"
                      else
                        echo "⚠️ **No-action path did not complete cleanly** (result: $main_result)"
                      fi
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

                  # The no-action job has no dry-run or guard preconditions, so
                  # selecting `main` and not running it means the selected phase
                  # and the path that actually ran disagree. That is a workflow
                  # defect rather than a release-state result, and reporting it
                  # as a summary line let a real regression through a green run.
                  if [ "$phase" = "main" ] \
                    && [ "$main_result" != "success" ] \
                    && [ "$main_result" != "cancelled" ]; then
                    inconsistent=true
                    echo "::error::Phase 'main' was selected but the no-release-action job did not run (result: $main_result)."
                  fi

                  if [ "$inconsistent" = "true" ]; then
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "❌ **Workflow defect:** the selected phase and the path that ran disagree." >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
