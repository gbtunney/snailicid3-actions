name: Smoke Cross-Repo (v1)

# SOURCE: gbtunney/snailicid3-actions
# Cross-repository caller boundary smoke pinned to the published v1 tag.

on:
    workflow_dispatch:
    schedule:
        - cron: '0 12 * * 1'

concurrency:
    group: smoke-cross-repo-v1
    cancel-in-progress: true

env:
    HUSKY: 0

jobs:
    release_plan:
        name: call-release-plan.yml@v1
        permissions:
            contents: write
            actions: write
            id-token: write
            pull-requests: write
        uses: gbtunney/snailicid3-actions/.github/workflows/call-release-plan.yml@v1
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
            dry_run: true
            run_pipeline: false

    pipeline:
        name: call-pipeline.yml@v1
        permissions:
            contents: read
        uses: gbtunney/snailicid3-actions/.github/workflows/call-pipeline.yml@v1
        # Pass only inputs shared by the pre-migration and post-migration v1
        # contracts so this smoke remains runnable before and after the tag is
        # promoted. Routine-specific defaults may differ; startup compatibility
        # is what this workflow asserts.
        with:
            mode: report
            check_mode: skip
            api_report_mode: skip
            lockfile_mode: frozen
            require_clean_repo: false

    verify:
        name: verify remote callers
        needs: [release_plan, pipeline]
        if: ${{ always() }}
        runs-on: ubuntu-latest

        steps:
            - name: Assert every remote-ref caller completed
              shell: bash
              run: |
                  set -euo pipefail

                  release_plan="${{ needs.release_plan.result }}"
                  pipeline="${{ needs.pipeline.result }}"

                  {
                    echo "## 🛰️ Cross-repository caller smoke (@v1)"
                    echo ""
                    echo "- call-release-plan.yml@v1: \`$release_plan\`"
                    echo "- call-pipeline.yml@v1: \`$pipeline\`"
                    echo "- release phase: \`${{ needs.release_plan.outputs.release_phase }}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

                  if [[ "$release_plan" != "success" || "$pipeline" != "success" ]]; then
                    echo "::error::A remote-ref caller did not succeed."
                    exit 1
                  fi
