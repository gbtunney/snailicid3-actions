name: Test Actions

# SOURCE: gbtunney/snailicid3-actions
#
# Self-test for this repository. Runs the composite actions and reusable
# workflows against the fixture workspace (package.json at the repo root,
# which depends on the published @snailicid3/config so snail-sh, scope-commit,
# and scope-affected are available via `pnpm exec`).
#
# Same-repository actions/workflows resolve from the current workflow commit.
# Composite actions use `$/`; reusable workflow calls may use `$/` or `./`.
#
# Same-repository refs cannot exercise the cross-repository caller boundary —
# see smoke-cross-repo.yml for that. What this suite does cover statically is
# the caller contract itself (bin/check-caller-contract.ts), because a wrong
# contract fails a consumer at workflow startup with zero jobs to inspect.

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    caller_contract:
        name: caller contract
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install fixture dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            # A checker that never fails is worse than no checker, so the
            # checker's own regression fixtures run first.
            - name: Prove the contract checker catches regressions
              run: pnpm test:callers

            - name: Check reusable workflows and caller templates
              run: pnpm check:callers

            - name: Sync templates into a throwaway consumer
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/consumer/.github/workflows"
                  bin/sync-callers.sh "$RUNNER_TEMP/consumer"

            - name: Synced consumer workflows must match their templates
              run: bin/sync-callers.sh --check "$RUNNER_TEMP/consumer"

            # A deleted or renamed template leaves its generated copy behind in
            # every consumer, still wired to the old secret contract. Looping
            # over templates alone can never see that file, so prove the orphan
            # scan does.
            - name: Drift check must flag an orphaned synced workflow
              shell: bash
              run: |
                  set -euo pipefail
                  orphan="$RUNNER_TEMP/consumer/.github/workflows/dispatch-obsolete.yml"
                  cp "$RUNNER_TEMP/consumer/.github/workflows/push-main.yml" "$orphan"

                  if bin/sync-callers.sh --check "$RUNNER_TEMP/consumer" > /dev/null 2>&1; then
                    echo "::error::sync-callers.sh --check passed with an orphaned synced workflow present."
                    exit 1
                  fi

                  rm "$orphan"
                  echo "Orphaned synced workflow correctly reported as drift."

            # The synced copies are what consumers actually run, so they get
            # checked as external callers: fully qualified refs, named secret
            # forwarding, permissions that cover the called workflow.
            - name: Synced consumer workflows must satisfy the caller contract
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm check:callers --external "$RUNNER_TEMP/consumer/.github/workflows"

    lockfile_policy:
        name: lockfile policy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            # lockfile_mode rests on two pnpm behaviours. Both are asserted
            # against a copy of the fixture, so the checkout stays clean.
            - name: A current lockfile installs frozen
              shell: bash
              run: |
                  set -euo pipefail

                  work="$RUNNER_TEMP/lockfile-clean"
                  mkdir -p "$work"
                  cp package.json pnpm-lock.yaml "$work/"

                  pnpm --dir "$work" install --frozen-lockfile
                  echo "Frozen install succeeded on the committed lockfile."

            - name: A stale lockfile fails frozen and is repaired by reconcile
              shell: bash
              run: |
                  set -euo pipefail

                  work="$RUNNER_TEMP/lockfile-stale"
                  mkdir -p "$work"
                  cp package.json pnpm-lock.yaml "$work/"

                  # Widen a devDependency range so the lockfile no longer
                  # matches the manifest — exactly the condition the old
                  # relaxed-install fallback used to paper over silently.
                  node --input-type=module -e '
                      import { readFileSync, writeFileSync } from "node:fs"

                      const manifestPath = process.argv[1] + "/package.json"
                      const manifest = JSON.parse(readFileSync(manifestPath, "utf8"))
                      manifest.devDependencies.prettier = "^3.0.0"
                      writeFileSync(manifestPath, JSON.stringify(manifest, null, 4) + "\n")
                  ' "$work"

                  before="$(shasum -a 256 "$work/pnpm-lock.yaml" | cut -d' ' -f1)"

                  if pnpm --dir "$work" install --frozen-lockfile > /dev/null 2>&1; then
                    echo "::error::A stale lockfile installed frozen — lockfile_mode: frozen would not catch drift."
                    exit 1
                  fi
                  echo "Frozen install correctly refused a stale lockfile."

                  pnpm --dir "$work" install --no-frozen-lockfile
                  after="$(shasum -a 256 "$work/pnpm-lock.yaml" | cut -d' ' -f1)"

                  if [[ "$before" == "$after" ]]; then
                    echo "::error::Reconcile left pnpm-lock.yaml unchanged — the repair path does nothing."
                    exit 1
                  fi
                  echo "Reconcile repaired the lockfile, which is what lockfile_mode: reconcile promises."

    composite_actions:
        name: composite actions
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install fixture dependencies
              run: pnpm install --frozen-lockfile

            - name: Report Environment
              uses: $/.github/actions/report-environment

            - name: Report Repository
              uses: $/.github/actions/report-repository

            - name: Report Prettier
              uses: $/.github/actions/report-prettier

            - name: Report Workspace
              uses: $/.github/actions/report-workspace

            - name: Require Up To Date (changeset-gated mode)
              uses: $/.github/actions/require-up-to-date
              with:
                  base-branch: main
                  require-changeset: 'true'

            # The fixture has no Nx, so `nx run-many` fails — which is exactly
            # what makes the report path testable: it must warn and continue.
            - name: Run Chromatic (skip) must no-op
              uses: $/.github/actions/run-chromatic
              with:
                  mode: skip

            - name: Run Chromatic (report) must survive a failing target
              uses: $/.github/actions/run-chromatic
              with:
                  mode: report

            - name: Run Chromatic (abort_on_error) must fail a failing target
              id: chromatic_abort
              continue-on-error: true
              uses: $/.github/actions/run-chromatic
              with:
                  mode: abort_on_error

            - name: Run Chromatic (bad mode) must be rejected
              id: chromatic_bad_mode
              continue-on-error: true
              uses: $/.github/actions/run-chromatic
              with:
                  mode: definitely-not-a-mode

            - name: Assert Chromatic step policy
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ steps.chromatic_abort.outcome }}" != "failure" ]]; then
                    echo "::error::abort_on_error should have failed on a failing target (got ${{ steps.chromatic_abort.outcome }})."
                    exit 1
                  fi

                  if [[ "${{ steps.chromatic_bad_mode.outcome }}" != "failure" ]]; then
                    echo "::error::An invalid mode should have been rejected (got ${{ steps.chromatic_bad_mode.outcome }})."
                    exit 1
                  fi

                  echo "Chromatic step policy behaves: skip no-ops, report continues, abort_on_error and a bad mode fail."

            - name: Assert scope-commit derives conventional messages
              shell: bash
              run: |
                  set -euo pipefail

                  message="$(SCOPE_COMMIT_SKIP_COMMITLINT=1 pnpm exec scope-commit --all --message chore "self test")"
                  echo "Derived message: $message"

                  if [[ ! "$message" =~ ^chore(\([a-z0-9,._-]+\))?:\ self\ test$ ]]; then
                    echo "::error::scope-commit produced an unexpected message: $message"
                    exit 1
                  fi

    detect_release_state:
        name: detect release state
        uses: $/.github/workflows/call-detect-release-state.yml

    assert_detect_outputs:
        name: assert detector outputs
        needs: detect_release_state
        runs-on: ubuntu-latest
        steps:
            - name: Fixture repo must resolve to should_skip
              shell: bash
              run: |
                  set -euo pipefail

                  echo "should_version=${{ needs.detect_release_state.outputs.should_version }}"
                  echo "should_publish=${{ needs.detect_release_state.outputs.should_publish }}"
                  echo "should_skip=${{ needs.detect_release_state.outputs.should_skip }}"

                  if [[ "${{ needs.detect_release_state.outputs.should_skip }}" != "true" ]]; then
                    echo "::error::Expected should_skip=true for the fixture repo (private package, no changesets)."
                    exit 1
                  fi

    make_test_artifact:
        name: make test artifact
        runs-on: ubuntu-latest
        steps:
            - name: Create workspace artifact archive
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/payload"
                  echo "self-test marker $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$RUNNER_TEMP/payload/SELF_TEST_MARKER.txt"
                  tar -czf "$RUNNER_TEMP/workspace-artifact.tar.gz" -C "$RUNNER_TEMP/payload" .

            - name: Upload workspace artifact
              uses: actions/upload-artifact@v7
              with:
                  name: self-test-workspace
                  path: ${{ runner.temp }}/workspace-artifact.tar.gz

    apply_workspace_artifact:
        name: apply workspace artifact
        needs: make_test_artifact
        # A caller must grant at least the permissions the called workflow
        # declares, or the whole run dies at startup ("startup_failure").
        permissions:
            contents: write
            actions: read
            id-token: write
        uses: $/.github/workflows/call-apply-workspace-artifact.yml
        # Mirrors dispatch-workspace-update: no post_overlay_command here, so
        # nothing authenticates to npm and NPM_TOKEN is not forwarded.
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
        with:
            artifact_name: self-test-workspace
            commit_mode: skip
            install_dependencies: true

    assert_apply_outputs:
        name: assert apply outputs
        needs: apply_workspace_artifact
        runs-on: ubuntu-latest
        steps:
            - name: Overlay must report a dirty workspace
              shell: bash
              run: |
                  set -euo pipefail

                  echo "is_dirty=${{ needs.apply_workspace_artifact.outputs.is_dirty }}"

                  if [[ "${{ needs.apply_workspace_artifact.outputs.is_dirty }}" != "true" ]]; then
                    echo "::error::Expected the overlaid marker file to leave the workspace dirty."
                    exit 1
                  fi
    release_plan_adapter:
        name: release plan adapter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            # The adapter runs in consumer CI from its runtime closure alone,
            # so prove that closure is sufficient before proving the mapping.
            - name: Install adapter runtime dependencies only
              run: pnpm install --frozen-lockfile --prod

            - name: Prove the adapter rejects unsupported schemaVersions and reproduces #232/#233/#234
              run: pnpm test:adapter

    release_plan:
        name: release plan
        permissions:
            contents: write
            actions: write
            id-token: write
            pull-requests: write
        uses: ./.github/workflows/call-release-plan.yml
        # Mirrors dispatch-release-plan/push-release so the self-test exercises
        # the same secret shape consumers use, dry run or not.
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
            dry_run: true
            run_pipeline: false
            adapter_ref: ${{ github.event.pull_request.head.sha || github.sha }}

    assert_phase_cutover:
        name: assert phase selection
        needs: release_plan
        runs-on: ubuntu-latest
        steps:
            - name: Canonical selection must be active and authorize nothing
              shell: bash
              env:
                  PHASE: ${{ needs.release_plan.outputs.release_phase }}
                  SHOULD_PUBLISH: ${{ needs.release_plan.outputs.should_publish }}
                  SHOULD_SKIP: ${{ needs.release_plan.outputs.should_skip }}
                  INVENTORY_COUNT: ${{ needs.release_plan.outputs.release_inventory_count }}
              run: |
                  set -euo pipefail

                  echo "phase=$PHASE should_publish=$SHOULD_PUBLISH should_skip=$SHOULD_SKIP inventory=$INVENTORY_COUNT"

                  # The fixture workspace holds one private package and no
                  # changesets, so the canonical plan must reach `main`.
                  if [[ "$PHASE" != "main" ]]; then
                    echo "::error::Expected the fixture workspace to select phase 'main' (got '$PHASE')."
                    exit 1
                  fi

                  if [[ "$SHOULD_SKIP" != "true" ]]; then
                    echo "::error::Phase 'main' must report should_skip=true (got '$SHOULD_SKIP')."
                    exit 1
                  fi

                  # A read-only observation authorizes nothing, whatever phase it selected.
                  if [[ "$SHOULD_PUBLISH" != "false" ]]; then
                    echo "::error::A read-only observation reported should_publish='$SHOULD_PUBLISH'; it must never authorize publication."
                    exit 1
                  fi

                  echo "Canonical selection is active, reached '$PHASE', and authorized nothing."
